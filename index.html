<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>New Tab</title>
    <style>
        /* 全局样式重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* 标题样式：加粗且更具现代感 */
        .title-container {
            position: absolute;
            top: 33%;
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800; /* 极粗字体 */
            color: #1d1d1f;
            letter-spacing: -1px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 立体玻璃搜索框 */
        .search-wrapper {
            position: absolute;
            top: calc(33% + 60px);
            width: 85%;
            max-width: 800px;
            height: 64px;
            display: flex;
            align-items: center;
            
            /* 玻璃拟态核心 */
            background-color: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            
            /* 立体阴影与边框 */
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.06), /* 外部柔和阴影 */
                0 2px 8px rgba(0, 0, 0, 0.04),  /* 贴近表面的阴影 */
                inset 0 1px 1px rgba(255, 255, 255, 0.9); /* 内部高光，增强玻璃厚度 */
            
            border-radius: 18px;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 聚焦时增强立体感 */
        .search-wrapper:focus-within {
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.08),
                0 4px 12px rgba(0, 0, 0, 0.05),
                inset 0 1px 1px rgba(255, 255, 255, 1);
            transform: scale(1.01);
        }

        /* 沉浸式图标按钮 */
        .engine-btn {
            width: 64px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .engine-btn:active { opacity: 0.6; }

        .engine-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        /* 输入框样式 */
        .search-input {
            flex-grow: 1;
            height: 100%;
            border: none;
            background: transparent;
            font-size: 1.2rem;
            color: #1d1d1f;
            padding-right: 20px;
        }
    </style>
</head>
<body>

    <div class="title-container">
        <h1>Explore</h1>
    </div>

    <div class="search-wrapper">
        <div class="engine-btn" id="engineBtn" title="切换搜索引擎">
            <!-- 默认显示高清 Google SVG -->
            <img src="" alt="Engine" class="engine-icon" id="engineIcon">
        </div>
        <input type="text" class="search-input" id="searchInput" autocomplete="off">
    </div>

    <script>
        // 使用内嵌的 SVG 确保在任何分辨率下都绝对清晰
        const engines = [

            },
            {
                name: 'Baidu',
                url: 'https://www.baidu.com/s?wd=',
                icon: 'https://www.baidu.com/favicon.ico' 
            },
            {
                name: 'Bing',
                url: 'https://cn.bing.com/search?q=',
                // Bing 高清蓝色 b 图标
                icon: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzAwODk3YiI+PHBhdGggZD0iTTUgM2wtMS41IDEuNSAxMS41IDExLjVMMTMuNSAxNy41bDEuNSAxLjUgMy0zLTEuNS0xLjVMMTggMTNsMS41IDEuNSAxLjUtMS41TDE5LjUgMTIgMjEgMTAuNSAxOS41IDkgMTggMTAuNSAxNi41IDkgMTUgMTAuNSAxMy41IDkgMTIgMTAuNSAxMC41IDkgOSA3LjUgNy41IDkgNiA3LjUgNC41IDZ6Ii8+PC9zdmc+'
            }
        ];

        let currentIndex = 0;
        const engineBtn = document.getElementById('engineBtn');
        const engineIcon = document.getElementById('engineIcon');
        const searchInput = document.getElementById('searchInput');

        // 初始化
        updateIcon();

        // 点击切换
        engineBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % engines.length;
            
            engineIcon.style.transform = 'scale(0.5) rotate(-10deg)';
            engineIcon.style.opacity = '0';
            
            setTimeout(() => {
                updateIcon();
                engineIcon.style.transform = 'scale(1) rotate(0deg)';
                engineIcon.style.opacity = '1';
            }, 150);

            searchInput.focus();
        });

        function updateIcon() {
            engineIcon.src = engines[currentIndex].icon;
        }

        // 回车搜索
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) {
                    window.location.href = engines[currentIndex].url + encodeURIComponent(query);
                }
            }
        });
        
        window.onload = () => searchInput.focus();
    </script>
</body>
</html>
