<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>New Tab</title>
    <style>
        /* 全局样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            /* 动态渐变背景，衬托玻璃效果 */
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 标题区域 */
        .title-container {
            margin-top: 20vh; /* 稍微上移标题 */
            margin-bottom: 3vh;
            text-align: center;
        }

        h1 {
            font-size: 4rem;
            font-weight: 800;
            color: rgba(255, 255, 255, 0.95);
            letter-spacing: -1px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        /* 玻璃拟态搜索框容器 */
        .search-wrapper {
            position: absolute;
            top: 33%; /* 位于屏幕垂直 1/3 处 */
            width: 85%; /* 适配平板宽屏 */
            max-width: 800px;
            height: 64px;
            
            /* 核心：玻璃拟态效果 */
            background: rgba(255, 255, 255, 0.25); /* 半透明白 */
            backdrop-filter: blur(16px); /* 背景模糊 */
            -webkit-backdrop-filter: blur(16px); /* Safari/小米浏览器兼容 */
            border: 1px solid rgba(255, 255, 255, 0.4); /* 亮色边框 */
            border-radius: 32px; /* 大圆角 */
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15); /* 柔和阴影 */
            
            display: flex;
            align-items: center;
            padding: 0 8px 0 16px;
            transition: all 0.3s ease;
        }

        .search-wrapper:focus-within {
            background: rgba(255, 255, 255, 0.35);
            box-shadow: 0 8px 40px 0 rgba(31, 38, 135, 0.25);
            transform: scale(1.02);
        }

        /* 搜索引擎图标按钮 */
        .engine-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: transform 0.2s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .engine-btn:active {
            transform: scale(0.9);
        }

        .engine-logo {
            width: 24px;
            height: 24px;
            object-fit: contain;
        }

        /* 输入框 */
        input[type="text"] {
            flex: 1;
            border: none;
            background: transparent;
            height: 100%;
            padding-left: 16px;
            font-size: 1.2rem;
            color: #333;
            font-weight: 500;
        }

        input::placeholder {
            color: rgba(0, 0, 0, 0.4);
            font-weight: 400;
        }

        /* 移动端/平板适配微调 */
        @media (max-width: 768px) {
            h1 { font-size: 3rem; }
            .search-wrapper { width: 90%; height: 56px; }
        }
    </style>
</head>
<body>

    <div class="title-container">
        <h1>Explore</h1>
    </div>

    <div class="search-wrapper">
        <!-- 搜索引擎切换图标 -->
        <div class="engine-btn" id="engineBtn" title="切换搜索引擎">
            <img src="" alt="Engine" class="engine-logo" id="engineLogo">
        </div>
        
        <!-- 搜索输入框 -->
        <input type="text" id="searchInput" placeholder="Search..." autocomplete="off" autofocus>
    </div>

    <script>
        // 搜索引擎配置 (使用 SVG Data URI 保证加载速度和清晰度)
        const engines = [
            {
                name: 'Baidu',
                url: 'https://www.baidu.com/s?wd=',
                // 百度蓝色爪印 SVG
                logo: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0iIzI5MzJlZSI+PHBhdGggZD0iTTEyIDJDNi40OCAyIDIgNi40OCAyIDEyczQuNDggMTAgMTAgMTAgMTAtNC40OCAxMC0xMFMxNy41MiAyIDEyIDJ6bS0xIDE1Yy0uNTUgMC0xLS40NS0xLTFzLjQ1LTEgMS0xIDEgLjQ1IDEgMS0uNDUgMS0xIDF6bTQtNGMtLjU1IDAtMS0uNDUtMS0xcy40NS0xIDEtMSAxIC40NSAxIDEtLjQ1IDEtMSAxeiIvPjwvc3ZnPg==' 
            },
            {
                name: 'Google',
                url: 'https://www.google.com/search?q=',
                // Google G Logo SVG
                logo: 'https://www.google.com/favicon.ico' 
            },
            {
                name: 'Bing',
                url: 'https://cn.bing.com/search?q=',
                // Bing Logo (Blue b)
                logo: 'https://bing.com/favicon.ico'
            }
        ];

        let currentIndex = 0;
        const engineBtn = document.getElementById('engineBtn');
        const engineLogo = document.getElementById('engineLogo');
        const searchInput = document.getElementById('searchInput');

        // 初始化显示第一个引擎
        updateEngineDisplay();

        // 点击图标切换逻辑
        engineBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % engines.length;
            updateEngineDisplay();
            searchInput.focus(); // 切换后保持聚焦
        });

        function updateEngineDisplay() {
            const engine = engines[currentIndex];
            engineLogo.src = engine.logo;
            searchInput.placeholder = `Search with ${engine.name}...`;
        }

        // 监听回车键进行搜索
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) {
                    const engine = engines[currentIndex];
                    window.location.href = engine.url + encodeURIComponent(query);
                }
            }
        });

        // 自动聚焦输入框
        window.onload = () => {
            searchInput.focus();
        };
    </script>
</body>
</html>
