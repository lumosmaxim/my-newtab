<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>New Tab</title>
    <style>
        /* 全局样式 */
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
            background-color: #ffffff;
            height: 100vh; width: 100vw;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 标题 */
        .title {
            margin-top: 28vh;
            font-size: 3.5rem; font-weight: 800; color: #000000;
            letter-spacing: -1px; margin-bottom: 30px; user-select: none;
        }

        /* 立体玻璃搜索框 */
        .search-container {
            position: relative; width: 85%; max-width: 700px; height: 64px;
            display: flex; align-items: center;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.08); border-radius: 32px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .search-container:focus-within {
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12), 0 4px 12px rgba(0, 0, 0, 0.06);
            transform: translateY(-2px); background: rgba(255, 255, 255, 0.85);
        }

        /* 沉浸式图标按钮 */
        .engine-btn {
            width: 50px; height: 100%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; flex-shrink: 0;
        }
        .engine-btn:active { opacity: 0.7; }

        /* 纯 CSS 图标样式 */
        .icon {
            width: 26px; height: 26px; transition: all 0.3s ease;
        }
        /* 百度：蓝色圆角方块 */
        .icon-baidu { background-color: #2932E1; border-radius: 6px; }
        /* 必应：青色圆角方块 */
        .icon-bing { background-color: #00809d; border-radius: 6px; }
        /* 谷歌：彩色圆点 */
        .icon-google {
            background: conic-gradient(from -45deg, #ea4335 110deg, #4285f4 90deg 180deg, #34a853 180deg 270deg, #fbbc05 270deg) 73% 73% / 100% 100% no-repeat;
            border-radius: 50%;
            -webkit-mask-image: radial-gradient(circle 11px at center, transparent 6px, black 6.5px);
            mask-image: radial-gradient(circle 11px at center, transparent 6px, black 6.5px);
        }

        /* 输入框 */
        .search-input {
            flex: 1; height: 100%; border: none; background: transparent;
            font-size: 1.2rem; color: #333; padding-right: 20px;
        }
        .search-input::placeholder { color: transparent; }
    </style>
</head>
<body>

    <div class="title">Explore</div>

    <div class="search-container">
        <div class="engine-btn" id="engineBtn">
            <!-- 默认显示百度图标 -->
            <div id="iconBox" class="icon icon-baidu"></div>
        </div>
        <input type="text" class="search-input" id="searchInput" autocomplete="off">
    </div>

    <script>
        const engines = [
            { name: 'baidu', url: 'https://www.baidu.com/s?wd=', cssClass: 'icon-baidu' },
            { name: 'google', url: 'https://www.google.com/search?q=', cssClass: 'icon-google' },
            { name: 'bing', url: 'https://cn.bing.com/search?q=', cssClass: 'icon-bing' }
        ];

        let currentIndex = 0;
        const engineBtn = document.getElementById('engineBtn');
        const iconBox = document.getElementById('iconBox');
        const searchInput = document.getElementById('searchInput');

        // 切换引擎
        engineBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % engines.length;
            updateIcon();
            searchInput.focus();
        });

        // 更新图标
        function updateIcon() {
            // 移除所有可能的图标类
            iconBox.className = 'icon'; 
            // 添加当前引擎对应的 CSS 类
            iconBox.classList.add(engines[currentIndex].cssClass);
        }

        // 回车搜索
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) window.location.href = engines[currentIndex].url + encodeURIComponent(query);
            }
        });

        // 自动聚焦
        searchInput.focus();
    </script>
</body>
</html>
