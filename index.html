<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>New Tab</title>
    <style>
        /* 全局样式 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent; /* 移除移动端点击高亮 */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff; /* 纯白背景 */
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        /* 标题区域 */
        .title-container {
            position: absolute;
            top: 33%; /* 位于屏幕三分之一处 */
            transform: translateY(-50%);
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            color: #1d1d1f; /* iOS 深灰黑 */
            letter-spacing: -0.5px;
            margin-bottom: 20px; /* 标题与搜索框的间距 */
            text-align: center;
        }

        /* 搜索框容器 */
        .search-wrapper {
            position: absolute;
            top: calc(33% + 60px); /* 标题下方 */
            width: 85%; /* 适配平板宽度 */
            max-width: 800px;
            height: 64px;
            display: flex;
            align-items: center;
            
            /* iOS 玻璃拟态核心代码 */
            background-color: rgba(255, 255, 255, 0.75); /* 半透明白 */
            backdrop-filter: blur(20px); /* 毛玻璃模糊 */
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 0, 0, 0.08); /* 极淡的边框 */
            border-radius: 18px; /* 大圆角 */
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04); /* 柔和阴影 */
            
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        /* 聚焦时的效果 */
        .search-wrapper:focus-within {
            background-color: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            transform: scale(1.01);
        }

        /* 左侧图标按钮（沉浸式） */
        .engine-btn {
            width: 64px;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: opacity 0.2s;
        }

        .engine-btn:active {
            opacity: 0.6;
        }

        .engine-icon {
            width: 28px;
            height: 28px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        /* 输入框 */
        .search-input {
            flex-grow: 1;
            height: 100%;
            border: none;
            background: transparent;
            font-size: 1.2rem;
            color: #1d1d1f;
            padding-right: 20px;
        }

        .search-input::placeholder {
            color: #86868b; /* iOS 占位符灰色 */
        }

    </style>
</head>
<body>

    <!-- 标题 -->
    <div class="title-container">
        <h1>Explore</h1>
    </div>

    <!-- 搜索框 -->
    <div class="search-wrapper">
        <!-- 搜索引擎切换按钮 -->
        <div class="engine-btn" id="engineBtn" title="切换搜索引擎">
            <!-- 默认显示 Google -->
            <img src="https://www.google.com/favicon.ico" alt="Engine" class="engine-icon" id="engineIcon">
        </div>
        
        <!-- 输入框 -->
        <input type="text" class="search-input" id="searchInput" placeholder="Search..." autocomplete="off">
    </div>

    <script>
        // 定义搜索引擎配置
        const engines = [
            {
                name: 'Google',
                url: 'https://www.google.com/search?q=',
                icon: 'https://www.google.com/favicon.ico'
            },
            {
                name: 'Baidu',
                url: 'https://www.baidu.com/s?wd=',
                // 使用百度官方高清 Logo 链接，确保是百度样式
                icon: 'https://www.baidu.com/favicon.ico' 
            },
            {
                name: 'Bing',
                url: 'https://cn.bing.com/search?q=',
                icon: 'https://bing.com/favicon.ico'
            }
        ];

        let currentIndex = 0; // 默认 Google
        
        const engineBtn = document.getElementById('engineBtn');
        const engineIcon = document.getElementById('engineIcon');
        const searchInput = document.getElementById('searchInput');

        // 初始化图标
        updateIcon();

        // 点击图标切换逻辑
        engineBtn.addEventListener('click', () => {
            currentIndex = (currentIndex + 1) % engines.length;
            
            // 添加一个小动画让切换更生动
            engineIcon.style.transform = 'scale(0.5) rotate(-10deg)';
            engineIcon.style.opacity = '0';
            
            setTimeout(() => {
                updateIcon();
                engineIcon.style.transform = 'scale(1) rotate(0deg)';
                engineIcon.style.opacity = '1';
            }, 150);

            // 切换后自动聚焦输入框
            searchInput.focus();
        });

        function updateIcon() {
            engineIcon.src = engines[currentIndex].icon;
            // 动态修改 placeholder 提示当前引擎（可选，若不需要可删除下一行）
            // searchInput.placeholder = `Search with ${engines[currentIndex].name}...`; 
        }

        // 监听回车键搜索
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) {
                    const targetUrl = engines[currentIndex].url + encodeURIComponent(query);
                    window.location.href = targetUrl;
                }
            }
        });
        
        // 页面加载后自动聚焦
        window.onload = () => {
            searchInput.focus();
        };
    </script>
</body>
</html>
